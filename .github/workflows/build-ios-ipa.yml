name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build local-only unsigned Manuscript IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Allow Swift macros in CI
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      - name: Prepare local-only sideload sources
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Manuscript/Manuscript/ManuscriptApp.swift")
          source = path.read_text()

          pattern = r'(?m)^(\s*)printICloudDebugInfo\(\)\s*$'
          replacement = r'\1// iCloud launch probe disabled for local-only sideload build.'
          source, count = re.subn(pattern, replacement, source, count=1)

          if count != 1:
              raise SystemExit("Could not find printICloudDebugInfo() in ManuscriptApp.swift")

          path.write_text(source)
          PY

          # The sideload artifact must not request iCloud capabilities tied to
          # the upstream developer's signing identity.
          /usr/libexec/PlistBuddy \
            -c 'Delete :CFBundleDocumentTypes:0:NSUbiquitousDocumentUserActivityType' \
            Manuscript/Manuscript/Info.plist || true

          /usr/libexec/PlistBuddy \
            -c 'Delete :com.apple.developer.icloud-services' \
            Manuscript/Manuscript/Manuscript.entitlements || true

          echo "Local-only sideload source preparation complete."

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Manuscript/Manuscript.xcodeproj \
            -scheme manuscript \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Build iOS app without code signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Manuscript/Manuscript.xcodeproj \
            -scheme manuscript \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ManuscriptDerivedData" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            DEVELOPMENT_TEAM='' \
            REGISTER_APP_GROUPS=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.davidpovarsky.manuscript.sideload \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify local-only app bundle
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/ManuscriptDerivedData/Build/Products/Release-iphoneos/Manuscript.app"
          INFO_PLIST="$APP_PATH/Info.plist"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected app bundle not found at: $APP_PATH"
            exit 1
          fi

          if [[ -d "$APP_PATH/_CodeSignature" ]]; then
            echo "Unexpected code signature found in unsigned app bundle."
            exit 1
          fi

          if [[ -f "$APP_PATH/embedded.mobileprovision" ]]; then
            echo "Unexpected provisioning profile found in unsigned app bundle."
            exit 1
          fi

          if /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:NSUbiquitousDocumentUserActivityType' "$INFO_PLIST" >/dev/null 2>&1; then
            echo "Unexpected iCloud document activity declaration remains in Info.plist."
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          if [[ "$BUNDLE_ID" != "com.davidpovarsky.manuscript.sideload" ]]; then
            echo "Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi

          echo "Verified local-only unsigned app bundle: $BUNDLE_ID"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/ManuscriptDerivedData/Build/Products/Release-iphoneos/Manuscript.app"
          PACKAGE_DIR="$RUNNER_TEMP/ManuscriptIPA"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/"

          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Manuscript-local-sideload.ipa" Payload

          echo "Created local-only sideload IPA:"
          ls -lh "$GITHUB_WORKSPACE/Manuscript-local-sideload.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manuscript-local-sideload-unsigned-ipa
          path: Manuscript-local-sideload.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Manuscript-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
